# The lefthook settings of this repository, which lefthook.yml extends.
pre-commit:
  jobs:
    # The design doc holds Japanese, so the Japanese check reads it, and
    # the English check leaves it out.
    - name: english
      exclude:
        - "docs/cross-platform-agent-design.md"
    - name: japanese
      glob:
        - "docs/cross-platform-agent-design.md"
